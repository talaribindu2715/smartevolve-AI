services:
  - type: web
    name: smartevolve-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      # Supabase PostgreSQL Database (Use Connection Pooler on port 6543 for IPv4 compatibility)
      # For Pooler:  jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
      #              User: postgres.[YOUR-PROJECT-REF] (e.g. postgres.abcdefghijklmnopqrst)
      # For Direct:  jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require
      #              User: postgres
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      # Supabase Auth JWT
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        value: https://rpc.sepolia.org
      - key: BLOCKCHAIN_CHAIN_ID
        value: 11155111
      - key: BLOCKCHAIN_NETWORK
        value: sepolia
      - key: CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
