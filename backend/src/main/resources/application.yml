server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartevolve-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:smartevolve;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:talaribindu767@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:jopowjfvvfuuauul}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Supabase Auth JWT Configuration
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-token-with-minimum-256-bits-length-for-hmac-sha}
    issuer: ${SUPABASE_JWT_ISSUER:https://your-project.supabase.co/auth/v1}

# Groq Cloud AI API Configuration (Ultra-Fast Inference on Groq LPUs)
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

# Anthropic Claude AI API Configuration
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-3-5-haiku-20241022}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}

# Google Gemini AI API Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta/models

# OpenAI API Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

# Web3j Blockchain Configuration
blockchain:
  enabled: true
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
  contract-address: ${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
  issuer-private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  network-name: ${BLOCKCHAIN_NETWORK:hardhat-local}

# Spring Boot Actuator (Health Checks for Render)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: false
    mail:
      enabled: false

# OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application-level Logging
logging:
  level:
    root: INFO
    com.smartevolve: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

