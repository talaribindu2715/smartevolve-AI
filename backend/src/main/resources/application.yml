server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartevolve-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Supabase Auth JWT Configuration
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-token-with-minimum-256-bits-length-for-hmac-sha}
    issuer: ${SUPABASE_JWT_ISSUER:https://your-project.supabase.co/auth/v1}

# Web3j Blockchain Configuration
blockchain:
  enabled: true
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
  contract-address: ${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
  issuer-private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  network-name: ${BLOCKCHAIN_NETWORK:hardhat-local}

# Spring Boot Actuator (Health Checks for Render)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: false

# OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application-level Logging
logging:
  level:
    root: INFO
    com.smartevolve: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

